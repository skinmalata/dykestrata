<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Abstract corporate visual representing layered business structure">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="0.6" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="strataA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#109aa6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2bb3bd" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="strataB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bb5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1b4f91" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#2bb3bd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2bb3bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#heroBg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <g opacity="0.9">
    <path d="M0 620 L300 520 L560 590 L820 470 L1200 560 L1200 900 L0 900 Z" fill="url(#strataB)"/>
    <path d="M0 700 L260 640 L540 700 L800 610 L1200 690 L1200 900 L0 900 Z" fill="url(#strataA)" opacity="0.75"/>
    <path d="M0 790 L320 740 L600 800 L900 720 L1200 780 L1200 900 L0 900 Z" fill="#0b2545" opacity="0.85"/>
  </g>

  <g fill="#0b2545" opacity="0.55">
    <rect x="120" y="360" width="70" height="240" rx="12"/>
    <rect x="220" y="300" width="70" height="300" rx="12"/>
    <rect x="320" y="410" width="70" height="190" rx="12"/>
  </g>
  <g fill="#2bb3bd">
    <rect x="120" y="360" width="70" height="14" rx="7"/>
    <rect x="220" y="300" width="70" height="14" rx="7"/>
    <rect x="320" y="410" width="70" height="14" rx="7"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.5" fill="none" stroke-width="3">
    <path d="M470 470 L640 360 L800 420 L980 250"/>
  </g>
  <g fill="#ffffff">
    <circle cx="470" cy="470" r="9"/>
    <circle cx="640" cy="360" r="9"/>
    <circle cx="800" cy="420" r="9"/>
    <circle cx="980" cy="250" r="11" fill="#2bb3bd"/>
  </g>

  <g opacity="0.6">
    <circle cx="980" cy="180" r="120" fill="none" stroke="#2bb3bd" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="980" cy="180" r="80" fill="none" stroke="#2bb3bd" stroke-opacity="0.4" stroke-width="2"/>
  </g>
</svg>
