    <path d="M-170 -74 C -100 -122, 20 -118, 108 -72 C 180 -34, 170 30, 102 70 C 26 114, -94 110, -156 64 C -208 26, -216 -42, -170 -74 Z" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3.5"/>
    <path d="M-92 -34 C -54 -62, 12 -58, 58 -34 C 96 -14, 92 18, 54 38 C 12 60, -52 58, -84 32 C -110 12, -114 -20, -92 -34 Z" fill="none" stroke="#c9a227" stroke-opacity="0.95" stroke-width="4"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-dasharray="14 12">
    <path d="M180 700 L400 540 L640 610 L880 430"/>
  </g>

  <g>
    <g fill="#0b2545" stroke="#2bb3bd" stroke-width="5">
