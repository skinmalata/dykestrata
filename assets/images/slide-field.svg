    <radialGradient id="s2glow" cx="0.8" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#2bb3bd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2bb3bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s2grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
