    <rect x="770" y="700" width="8" height="128" rx="4" fill="#2bb3bd"/>
    <text x="802" y="752" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Development</text>
    <text x="802" y="794" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#c9a227">Phasing · Well spacing</text>
