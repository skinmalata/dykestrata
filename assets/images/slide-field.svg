<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Abstract prospectivity contour map with ranked leads and well locations">
  <defs>
    <linearGradient id="s2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="0.6" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="s2blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb3bd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6bb5" stop-opacity="0.15"/>
