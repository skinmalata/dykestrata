<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="Abstract geometric visual representing company structure and planning">
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="aboutNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#1b4f91"/>
    </linearGradient>
    <linearGradient id="aboutTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#109aa6"/>
      <stop offset="1" stop-color="#2bb3bd"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0b2545" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="900" height="900" fill="url(#aboutBg)"/>
  <rect x="60" y="60" width="360" height="360" rx="24" fill="url(#dots)"/>

  <rect x="180" y="180" width="420" height="420" rx="28" fill="url(#aboutNavy)"/>
  <rect x="250" y="250" width="420" height="420" rx="28" fill="#ffffff" stroke="#e2e8f0"/>

  <g fill="#0b2545" opacity="0.85">
    <rect x="320" y="330" width="220" height="18" rx="9" opacity="0.25"/>
    <rect x="320" y="368" width="280" height="12" rx="6" opacity="0.18"/>
    <rect x="320" y="392" width="240" height="12" rx="6" opacity="0.18"/>
  </g>

  <g>
    <rect x="320" y="440" width="120" height="80" rx="14" fill="url(#aboutTeal)"/>
    <rect x="460" y="440" width="120" height="80" rx="14" fill="#0b2545"/>
    <rect x="320" y="540" width="260" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="320" y="568" width="200" height="14" rx="7" fill="#e2e8f0"/>
  </g>

  <circle cx="720" cy="600" r="90" fill="#109aa6" opacity="0.14"/>
  <circle cx="720" cy="600" r="52" fill="url(#aboutTeal)"/>
  <path d="M700 600l14 14 28-32" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
