<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Abstract petrophysical log tracks with porosity, saturation and lithology curves">
  <defs>
    <linearGradient id="s3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="0.6" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="s3glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb3bd" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2bb3bd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="s3glowR" cx="0.82" cy="0.14" r="0.7">
      <stop offset="0" stop-color="#2bb3bd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2bb3bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s3grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="s3clip">
      <rect x="300" y="150" width="780" height="620" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#s3bg)"/>
  <rect width="1200" height="900" fill="url(#s3grid)"/>
  <rect width="1200" height="900" fill="url(#s3glowR)"/>

  <g>
    <rect x="150" y="150" width="120" height="620" rx="14" fill="#071a35" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <g>
