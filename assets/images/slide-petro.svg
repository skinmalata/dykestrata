    <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2">
      <line x1="560" y1="150" x2="560" y2="770"/>
      <line x1="820" y1="150" x2="820" y2="770"/>
      <line x1="300" y1="305" x2="1080" y2="305"/>
      <line x1="300" y1="460" x2="1080" y2="460"/>
