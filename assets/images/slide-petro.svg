      <line x1="158" y1="298" x2="262" y2="298"/>
      <line x1="158" y1="418" x2="262" y2="418"/>
      <line x1="158" y1="490" x2="262" y2="490"/>
      <line x1="158" y1="586" x2="262" y2="586"/>
      <line x1="158" y1="650" x2="262" y2="650"/>
    </g>
