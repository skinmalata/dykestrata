      <rect x="158" y="244" width="104" height="54" fill="#109aa6" fill-opacity="0.55"/>
      <rect x="158" y="298" width="104" height="120" fill="#123a6b" fill-opacity="0.85"/>
      <rect x="158" y="418" width="104" height="72" fill="#0e7c86" fill-opacity="0.7"/>
      <rect x="158" y="490" width="104" height="96" fill="#1b4f91" fill-opacity="0.7"/>
      <rect x="158" y="586" width="104" height="64" fill="#c9a227" fill-opacity="0.55"/>
      <rect x="158" y="650" width="104" height="112" fill="#0b2545" fill-opacity="0.9"/>
